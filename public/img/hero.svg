<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-label="Ruang GTK ConSentinel Security Viewport">
  <defs>
    <!-- Caustic & Radiant Sky Gradients -->
    <radialGradient id="cs-sphere" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#e0f2fe" stop-opacity="0.75"/>
      <stop offset="55%" stop-color="#7dd3fc" stop-opacity="0.35"/>
      <stop offset="85%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.5"/>
    </radialGradient>

    <radialGradient id="cs-backglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#0369a1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#020817" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="cs-blade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#bae6fd" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="cs-glass-panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1a30" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#081022" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="cs-border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#60a5fa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.15"/>
    </linearGradient>

    <filter id="cs-glow-lg" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Caustic Background Field -->
  <circle cx="380" cy="270" r="260" fill="url(#cs-backglow)"/>

  <!-- Concentric Orbital Grid Tracks (ConSentinel Style) -->
  <ellipse cx="380" cy="280" rx="340" ry="160" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.2" stroke-dasharray="6 10"/>
  <ellipse cx="380" cy="280" rx="270" ry="125" fill="none" stroke="rgba(56,189,248,0.18)" stroke-width="1.5" stroke-dasharray="4 8" transform="rotate(-8 380 280)"/>
  <ellipse cx="380" cy="280" rx="200" ry="90" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="2 6" transform="rotate(12 380 280)"/>

  <!-- CENTRAL CRYSTAL GLASS SPHERE & CAUSTIC BLADE (Iconic ConSentinel Centerpiece) -->
  <g transform="translate(380, 270)">
    <!-- Sphere Shadow Reflection -->
    <ellipse cx="0" cy="110" rx="100" ry="24" fill="#020817" opacity="0.6" filter="url(#cs-glow-lg)"/>
    
    <!-- Primary Crystal Sphere -->
    <circle cx="0" cy="0" r="105" fill="url(#cs-sphere)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
    
    <!-- Intersecting Crystal Glass Blade -->
    <path d="M-150 -60 L150 -10 L120 70 L-180 20 Z" fill="url(#cs-blade)" stroke="rgba(255,255,255,0.5)" stroke-width="1.2" opacity="0.75" transform="rotate(-18)"/>

    <!-- Caustic Light Ribs on Sphere -->
    <ellipse cx="-15" cy="-25" rx="55" ry="32" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.65" transform="rotate(-30 -15 -25)"/>
    <circle cx="-35" cy="-45" r="8" fill="#ffffff" opacity="0.85" filter="url(#cs-glow-lg)"/>
  </g>

  <!-- FLOATING HUD PANEL 1: Security Sentinel Telemetry (Top Left) -->
  <g transform="translate(40, 70)">
    <rect x="0" y="0" width="260" height="110" rx="20" fill="url(#cs-glass-panel)" stroke="url(#cs-border-glow)" stroke-width="1.4" filter="url(#cs-glow-lg)"/>
    <!-- Top Header -->
    <circle cx="24" cy="24" r="5" fill="#38bdf8"/>
    <text x="38" y="28" fill="#e0f2fe" font-family="Inter, sans-serif" font-size="11" font-weight="700" letter-spacing="0.06em">ISOLASI MULTI-TENANT</text>
    <rect x="180" y="16" width="66" height="18" rx="9" fill="rgba(56,189,248,0.15)"/>
    <text x="213" y="28.5" fill="#38bdf8" font-family="Inter, sans-serif" font-size="9" font-weight="700" text-anchor="middle">ACTIVE</text>
    <line x1="16" y1="44" x2="244" y2="44" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <!-- Subdomain Telemetry Metric -->
    <text x="24" y="68" fill="#ffffff" font-family="Inter, sans-serif" font-size="20" font-weight="800">100% SECURE</text>
    <text x="24" y="88" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">Data terpisah per subdomain sekolah</text>
  </g>

  <!-- FLOATING HUD PANEL 2: Real-time GTK & Academic Pulse (Bottom Left) -->
  <g transform="translate(48, 380)">
    <rect x="0" y="0" width="240" height="96" rx="20" fill="url(#cs-glass-panel)" stroke="url(#cs-border-glow)" stroke-width="1.4" filter="url(#cs-glow-lg)"/>
    <circle cx="24" cy="24" r="5" fill="#34d399"/>
    <text x="38" y="28" fill="#e0f2fe" font-family="Inter, sans-serif" font-size="11" font-weight="700">PRESENSI GTK &amp; SISWA</text>
    <line x1="16" y1="42" x2="224" y2="42" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="24" y="68" fill="#34d399" font-family="Inter, sans-serif" font-size="22" font-weight="800">99.4%</text>
    <text x="100" y="68" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">Kehadiran tercatat harian</text>
    <rect x="24" y="78" width="190" height="5" rx="2.5" fill="rgba(255,255,255,0.1)"/>
    <rect x="24" y="78" width="170" height="5" rx="2.5" fill="#34d399"/>
  </g>

  <!-- FLOATING HUD PANEL 3: Smart Ledger & SPP (Top Right) -->
  <g transform="translate(470, 80)">
    <rect x="0" y="0" width="250" height="120" rx="20" fill="url(#cs-glass-panel)" stroke="url(#cs-border-glow)" stroke-width="1.4" filter="url(#cs-glow-lg)"/>
    <circle cx="24" cy="24" r="5" fill="#fbbf24"/>
    <text x="38" y="28" fill="#e0f2fe" font-family="Inter, sans-serif" font-size="11" font-weight="700">REKAPITULASI KEUANGAN</text>
    <line x1="16" y1="44" x2="234" y2="44" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="24" y="72" fill="#fbbf24" font-family="Inter, sans-serif" font-size="22" font-weight="800">Rp 142.8M</text>
    <text x="24" y="94" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11.5">Tagihan &amp; SPP terkelola rapi</text>
  </g>

  <!-- FLOATING HUD PANEL 4: Notification Broadcast (Bottom Right) -->
  <g transform="translate(480, 360)">
    <rect x="0" y="0" width="240" height="100" rx="20" fill="url(#cs-glass-panel)" stroke="url(#cs-border-glow)" stroke-width="1.4" filter="url(#cs-glow-lg)"/>
    <circle cx="24" cy="24" r="5" fill="#60a5fa"/>
    <text x="38" y="28" fill="#e0f2fe" font-family="Inter, sans-serif" font-size="11" font-weight="700">WARTA &amp; PENGUMUMAN</text>
    <line x1="16" y1="42" x2="224" y2="42" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="24" y="65" fill="#ffffff" font-family="Inter, sans-serif" font-size="13" font-weight="600">Terdistribusi Instan</text>
    <text x="24" y="82" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">Seluruh GTK, siswa &amp; wali murid</text>
  </g>

  <!-- Sentinel Sparkling Nodes -->
  <circle cx="340" cy="120" r="3" fill="#ffffff" filter="url(#cs-glow-lg)"/>
  <circle cx="440" cy="420" r="3.5" fill="#38bdf8" filter="url(#cs-glow-lg)"/>
  <circle cx="160" cy="260" r="2.5" fill="#bae6fd"/>
  <circle cx="610" cy="250" r="3" fill="#ffffff"/>
</svg>
