<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" width="560" height="480" role="img" aria-label="Ilustrasi dashboard Ruang GTK">
  <defs>
    <linearGradient id="h-orb-o" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb45e"/><stop offset="1" stop-color="#ff6a3d"/>
    </linearGradient>
    <linearGradient id="h-orb-v" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="h-orb-t" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="h-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#31364a" stop-opacity=".92"/>
      <stop offset="1" stop-color="#1a1e2b" stop-opacity=".88"/>
    </linearGradient>
    <linearGradient id="h-bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c084fc"/><stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>

  <!-- orbs -->
  <circle cx="452" cy="96" r="120" fill="url(#h-orb-o)" opacity=".8"/>
  <circle cx="96" cy="150" r="92" fill="url(#h-orb-v)" opacity=".75"/>
  <circle cx="140" cy="392" r="108" fill="url(#h-orb-t)" opacity=".7"/>

  <!-- gedung sekolah -->
  <g transform="translate(60 210)">
    <rect x="0" y="70" width="120" height="88" rx="8" fill="#232838" stroke="rgba(255,255,255,.16)"/>
    <path d="M-8 70 L60 22 L128 70 Z" fill="url(#h-orb-v)"/>
    <rect x="18" y="88" width="18" height="18" rx="3" fill="#5eead4" opacity=".85"/>
    <rect x="50" y="88" width="18" height="18" rx="3" fill="#ffb45e" opacity=".85"/>
    <rect x="82" y="88" width="18" height="18" rx="3" fill="#a78bfa" opacity=".85"/>
    <rect x="50" y="118" width="20" height="40" rx="4" fill="#12151f" stroke="rgba(255,255,255,.2)"/>
    <line x1="-8" y1="158" x2="128" y2="158" stroke="rgba(255,255,255,.2)" stroke-width="2"/>
  </g>

  <!-- garis koneksi -->
  <path d="M200 268 C 250 240, 260 240, 300 240" stroke="rgba(255,255,255,.3)" stroke-width="2" stroke-dasharray="4 6" fill="none"/>
  <circle cx="300" cy="240" r="4" fill="#5eead4"/>

  <!-- kartu dashboard kaca -->
  <g transform="translate(310 120)">
    <rect x="0" y="0" width="200" height="230" rx="20" fill="url(#h-glass)" stroke="rgba(255,255,255,.18)"/>
    <circle cx="22" cy="24" r="5" fill="#ff6a3d"/>
    <circle cx="40" cy="24" r="5" fill="#ffb45e" opacity=".6"/>
    <circle cx="58" cy="24" r="5" fill="#5eead4" opacity=".6"/>
    <rect x="18" y="46" width="70" height="10" rx="5" fill="rgba(255,255,255,.35)"/>
    <rect x="18" y="68" width="50" height="34" rx="10" fill="url(#h-orb-v)"/>
    <rect x="76" y="68" width="50" height="34" rx="10" fill="url(#h-orb-t)"/>
    <rect x="134" y="68" width="50" height="34" rx="10" fill="url(#h-orb-o)"/>
    <g>
      <rect x="24" y="150" width="16" height="42" rx="5" fill="url(#h-bar)"/>
      <rect x="50" y="132" width="16" height="60" rx="5" fill="url(#h-bar)"/>
      <rect x="76" y="142" width="16" height="50" rx="5" fill="url(#h-bar)"/>
      <rect x="102" y="118" width="16" height="74" rx="5" fill="url(#h-bar)"/>
      <rect x="128" y="150" width="16" height="42" rx="5" fill="url(#h-bar)"/>
      <rect x="154" y="128" width="16" height="64" rx="5" fill="url(#h-bar)"/>
    </g>
    <rect x="18" y="204" width="164" height="8" rx="4" fill="rgba(255,255,255,.14)"/>
  </g>

  <!-- notifikasi toast -->
  <g transform="translate(330 386)">
    <rect x="0" y="0" width="190" height="56" rx="16" fill="url(#h-glass)" stroke="rgba(255,255,255,.16)"/>
    <circle cx="28" cy="28" r="13" fill="url(#h-orb-t)"/>
    <path d="M22 28 l4 4 8-8" stroke="#08131a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="50" y="18" width="94" height="9" rx="4.5" fill="rgba(255,255,255,.5)"/>
    <rect x="50" y="33" width="66" height="8" rx="4" fill="rgba(255,255,255,.25)"/>
  </g>

  <!-- sparkle -->
  <path d="M262 88 l4.6 9.8 9.8 4.6 -9.8 4.6 -4.6 9.8 -4.6 -9.8 -9.8 -4.6 9.8 -4.6 Z" fill="rgba(255,255,255,.85)"/>
  <path d="M520 300 l3.2 6.8 6.8 3.2 -6.8 3.2 -3.2 6.8 -3.2 -6.8 -6.8 -3.2 6.8 -3.2 Z" fill="rgba(94,234,212,.85)"/>
</svg>
