<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="Arsitektur Multi-Tenant Ruang GTK">
  <defs>
    <linearGradient id="ten-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191e2e"/>
      <stop offset="100%" stop-color="#0a0c13"/>
    </linearGradient>
    <linearGradient id="ten-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="ten-cube-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="ten-cube-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3730a3"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="ten-cube-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
  </defs>

  <rect width="320" height="200" rx="20" fill="url(#ten-bg)" stroke="url(#ten-border)" stroke-width="1.2"/>

  <!-- Glowing Background Mesh -->
  <circle cx="160" cy="100" r="70" fill="#6366f1" opacity="0.16"/>
  <circle cx="230" cy="70" r="45" fill="#06b6d4" opacity="0.14"/>

  <!-- Network Coordinate Lines -->
  <line x1="80" y1="140" x2="160" y2="90" stroke="rgba(99,102,241,0.3)" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="240" y1="140" x2="160" y2="90" stroke="rgba(6,182,212,0.3)" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Central Cloud Hub (Isometric Cube) -->
  <g transform="translate(160, 75)">
    <!-- Top Face -->
    <path d="M0 -30 L36 -12 L0 6 L-36 -12 Z" fill="url(#ten-cube-top)"/>
    <!-- Left Face -->
    <path d="M-36 -12 L0 6 L0 44 L-36 26 Z" fill="url(#ten-cube-left)"/>
    <!-- Right Face -->
    <path d="M0 6 L36 -12 L36 26 L0 44 Z" fill="url(#ten-cube-right)"/>
    <!-- Core Glow Vertex -->
    <circle cx="0" cy="-12" r="6" fill="#38bdf8"/>
  </g>

  <!-- Left Satellite Tenant Pod (Sekolah 1) -->
  <g transform="translate(48, 115)">
    <rect x="0" y="0" width="76" height="52" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(99,102,241,0.4)" stroke-width="1.2"/>
    <circle cx="16" cy="18" r="5" fill="#34d399"/>
    <rect x="26" y="14" width="38" height="8" rx="4" fill="rgba(255,255,255,0.4)"/>
    <rect x="12" y="30" width="52" height="12" rx="6" fill="rgba(99,102,241,0.15)"/>
    <text x="38" y="39" fill="#c7d2fe" font-family="Inter, sans-serif" font-size="7.5" font-weight="600" text-anchor="middle">@smpn1.ruang</text>
  </g>

  <!-- Right Satellite Tenant Pod (Sekolah 2) -->
  <g transform="translate(196, 115)">
    <rect x="0" y="0" width="76" height="52" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(6,182,212,0.4)" stroke-width="1.2"/>
    <circle cx="16" cy="18" r="5" fill="#38bdf8"/>
    <rect x="26" y="14" width="38" height="8" rx="4" fill="rgba(255,255,255,0.4)"/>
    <rect x="12" y="30" width="52" height="12" rx="6" fill="rgba(6,182,212,0.15)"/>
    <text x="38" y="39" fill="#bae6fd" font-family="Inter, sans-serif" font-size="7.5" font-weight="600" text-anchor="middle">@sman2.ruang</text>
  </g>

  <!-- Shield Badge at Top -->
  <g transform="translate(160, 26)">
    <rect x="-42" y="0" width="84" height="22" rx="11" fill="rgba(52,211,153,0.12)" stroke="rgba(52,211,153,0.35)" stroke-width="1"/>
    <text x="0" y="14.5" fill="#34d399" font-family="Inter, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">🔒 ISOLASI PENUH</text>
  </g>
</svg>
