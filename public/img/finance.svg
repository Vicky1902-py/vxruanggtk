<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="Modul Keuangan dan SPP Ruang GTK">
  <defs>
    <linearGradient id="fin-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b1c2b"/>
      <stop offset="100%" stop-color="#0a0c13"/>
    </linearGradient>
    <linearGradient id="fin-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="fin-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="60%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <rect width="320" height="200" rx="20" fill="url(#fin-bg)" stroke="url(#fin-border)" stroke-width="1.2"/>
  <circle cx="100" cy="80" r="70" fill="#f59e0b" opacity="0.12"/>
  <circle cx="240" cy="140" r="60" fill="#ec4899" opacity="0.1"/>

  <!-- Main Floating Smart Payment Card -->
  <g transform="translate(36, 32)">
    <rect x="0" y="0" width="160" height="96" rx="14" fill="url(#fin-card)" filter="drop-shadow(0 12px 24px rgba(234,88,12,0.35))"/>
    <!-- Card Chip -->
    <rect x="16" y="16" width="24" height="18" rx="4" fill="#fef08a" stroke="#ca8a04" stroke-width="0.8"/>
    <!-- Contactless wave -->
    <path d="M48 20 C52 23, 52 27, 48 30 M53 17 C59 22, 59 28, 53 33" stroke="rgba(255,255,255,0.7)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <text x="16" y="62" fill="rgba(255,255,255,0.9)" font-family="monospace" font-size="11" font-weight="700">•••• 5824</text>
    <text x="16" y="78" fill="rgba(255,255,255,0.7)" font-family="Inter, sans-serif" font-size="8">SPP BULANAN</text>
    <text x="110" y="78" fill="#ffffff" font-family="Inter, sans-serif" font-size="10" font-weight="700">LUNAS</text>
  </g>

  <!-- Secondary Transaction Panel -->
  <g transform="translate(160, 85)">
    <rect x="0" y="0" width="124" height="78" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="12" y="20" fill="#94a3b8" font-family="Inter, sans-serif" font-size="8">TOTAL TERCATAT</text>
    <text x="12" y="38" fill="#fbbf24" font-family="Inter, sans-serif" font-size="13" font-weight="700">Rp 450.000</text>
    <rect x="12" y="48" width="98" height="18" rx="9" fill="rgba(52,211,153,0.15)"/>
    <text x="61" y="60.5" fill="#34d399" font-family="Inter, sans-serif" font-size="8" font-weight="700" text-anchor="middle">⚡ OTOMATIS VA/QRIS</text>
  </g>
</svg>
