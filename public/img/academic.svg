<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="Modul Akademik dan Presensi GTK">
  <defs>
    <linearGradient id="acad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181c2d"/>
      <stop offset="100%" stop-color="#0a0c13"/>
    </linearGradient>
    <linearGradient id="acad-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="acad-pill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="320" height="200" rx="20" fill="url(#acad-bg)" stroke="url(#acad-border)" stroke-width="1.2"/>
  <circle cx="240" cy="60" r="60" fill="#8b5cf6" opacity="0.14"/>
  <circle cx="80" cy="140" r="50" fill="#3b82f6" opacity="0.12"/>

  <!-- Academic Record List -->
  <g transform="translate(24, 28)">
    <!-- Row 1: Student Ahmad -->
    <rect x="0" y="0" width="272" height="40" rx="10" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <circle cx="20" cy="20" r="12" fill="url(#acad-pill)"/>
    <text x="20" y="24" fill="#ffffff" font-family="Inter, sans-serif" font-size="9" font-weight="700" text-anchor="middle">AS</text>
    <rect x="42" y="12" width="70" height="8" rx="4" fill="rgba(255,255,255,0.6)"/>
    <rect x="42" y="24" width="45" height="5" rx="2.5" fill="rgba(255,255,255,0.2)"/>
    <rect x="210" y="11" width="50" height="18" rx="9" fill="rgba(52,211,153,0.15)"/>
    <text x="235" y="23" fill="#34d399" font-family="Inter, sans-serif" font-size="8" font-weight="700" text-anchor="middle">✓ HADIR</text>

    <!-- Row 2: Student Budi -->
    <rect x="0" y="48" width="272" height="40" rx="10" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <circle cx="20" cy="68" r="12" fill="rgba(6,182,212,0.6)"/>
    <text x="20" y="72" fill="#ffffff" font-family="Inter, sans-serif" font-size="9" font-weight="700" text-anchor="middle">BW</text>
    <rect x="42" y="60" width="85" height="8" rx="4" fill="rgba(255,255,255,0.6)"/>
    <rect x="42" y="72" width="55" height="5" rx="2.5" fill="rgba(255,255,255,0.2)"/>
    <rect x="210" y="59" width="50" height="18" rx="9" fill="rgba(52,211,153,0.15)"/>
    <text x="235" y="71" fill="#34d399" font-family="Inter, sans-serif" font-size="8" font-weight="700" text-anchor="middle">✓ HADIR</text>

    <!-- Row 3: Student Citra -->
    <rect x="0" y="96" width="272" height="40" rx="10" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <circle cx="20" cy="116" r="12" fill="rgba(244,114,182,0.6)"/>
    <text x="20" y="120" fill="#ffffff" font-family="Inter, sans-serif" font-size="9" font-weight="700" text-anchor="middle">CL</text>
    <rect x="42" y="108" width="60" height="8" rx="4" fill="rgba(255,255,255,0.6)"/>
    <rect x="42" y="120" width="38" height="5" rx="2.5" fill="rgba(255,255,255,0.2)"/>
    <rect x="210" y="107" width="50" height="18" rx="9" fill="rgba(245,158,11,0.15)"/>
    <text x="235" y="119" fill="#fbbf24" font-family="Inter, sans-serif" font-size="8" font-weight="700" text-anchor="middle">ℹ IZIN</text>
  </g>
</svg>
