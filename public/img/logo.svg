<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- ConSentinel Deep Ink & Frosted Crystal Gradients -->
    <linearGradient id="cs-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1528"/>
      <stop offset="50%" stop-color="#050a16"/>
      <stop offset="100%" stop-color="#02050e"/>
    </linearGradient>

    <linearGradient id="cs-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="35%" stop-color="#93c5fd" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="cs-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <clipPath id="cs-clip">
      <circle cx="64" cy="64" r="54"/>
    </clipPath>

    <filter id="cs-halo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Icy Caustic Halo -->
  <circle cx="64" cy="64" r="52" fill="#38bdf8" opacity="0.18" filter="url(#cs-halo)"/>

  <!-- Master Shield Plate -->
  <rect x="6" y="6" width="116" height="116" rx="36" fill="url(#cs-bg)" stroke="url(#cs-rim)" stroke-width="1.6"/>

  <!-- ConSentinel Globe Latitude Ribs -->
  <g clip-path="url(#cs-clip)" stroke="url(#cs-glow)" fill="none" opacity="0.55" stroke-linecap="round">
    <path d="M42 22 c14 -3 29 -3 44 0" stroke-width="2"/>
    <path d="M22 36 c18 -7 38 -8 56 -4 c12 3 20 7 30 8" stroke-width="2.5"/>
    <path d="M14 50 c20 -9 44 -11 64 -6 c11 3 19 8 30 9" stroke-width="3"/>
    <path d="M10 65 c22 -10 47 -12 68 -6 c8 3 15 6 22 8 c13 4 25 1 36 -5" stroke-width="3.2"/>
    <path d="M12 80 c21 -9 45 -11 65 -6 c10 3 18 7 28 8" stroke-width="2.8"/>
    <path d="M20 94 c18 -7 38 -9 57 -5 c10 2 17 6 27 6" stroke-width="2.3"/>
    <path d="M38 108 c13 -4 27 -4 40 -1" stroke-width="1.8"/>
  </g>

  <!-- Outer Precision Ring -->
  <circle cx="64" cy="64" r="52" stroke="rgba(255,255,255,0.18)" stroke-width="1.2" fill="none"/>

  <!-- Central Crystalline "R" Monogram + GTK Apex -->
  <!-- Vertical Pillar -->
  <path d="M42 38 L54 38 L54 90 L42 90 Z" fill="#ffffff" filter="drop-shadow(0 4px 12px rgba(56,189,248,0.5))"/>
  <!-- Top Loop -->
  <path d="M52 38 L74 38 C84 38, 90 44, 90 53 C90 62, 84 68, 74 68 L52 68 Z" fill="#ffffff"/>
  <path d="M54 46 L72 46 C77 46, 80 49, 80 53 C80 57, 77 60, 72 60 L54 60 Z" fill="#081024"/>
  <!-- Diagonal Leg -->
  <path d="M66 64 L82 90 L96 90 L78 64 Z" fill="url(#cs-glow)"/>

  <!-- Graduation Beacon Apex (GTK motif) -->
  <path d="M64 26 L82 35 L64 44 L46 35 Z" fill="#38bdf8" opacity="0.95"/>
  <circle cx="64" cy="35" r="3" fill="#ffffff"/>

  <!-- Caustic Spark Flare -->
  <circle cx="86" cy="36" r="2.5" fill="#ffffff" filter="url(#cs-halo)"/>
</svg>
