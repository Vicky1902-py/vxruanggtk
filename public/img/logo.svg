<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="vtx-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181b29"/>
      <stop offset="50%" stop-color="#0e101a"/>
      <stop offset="100%" stop-color="#07080e"/>
    </linearGradient>

    <!-- Outer Glow Border -->
    <linearGradient id="vtx-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#c084fc" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Core Vertex Gradient (Indigo to Cyan to Violet) -->
    <linearGradient id="vtx-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="45%" stop-color="#8b5cf6"/>
      <stop offset="80%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Vertex Facet Light -->
    <linearGradient id="vtx-facet" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#e0e7ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a5b4fc" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Amber Glow Accent -->
    <linearGradient id="vtx-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <!-- Filter for Luminous Halos -->
    <filter id="vtx-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="vtx-subtle-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Under-glow -->
  <circle cx="64" cy="64" r="44" fill="#6366f1" opacity="0.25" filter="url(#vtx-glow)"/>
  <circle cx="76" cy="46" r="32" fill="#06b6d4" opacity="0.2" filter="url(#vtx-glow)"/>

  <!-- Base Capsule / Badge -->
  <rect x="6" y="6" width="116" height="116" rx="32" fill="url(#vtx-bg)" stroke="url(#vtx-border)" stroke-width="1.8"/>

  <!-- Subtle Inner Grid Coordinate -->
  <path d="M64 16 L64 112 M16 64 L112 64" stroke="rgba(255,255,255,0.04)" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Orbital Cyber Ring -->
  <ellipse cx="64" cy="64" rx="46" ry="18" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1.2" stroke-dasharray="4 8" transform="rotate(-25 64 64)"/>

  <!-- Orbital Node -->
  <circle cx="28" cy="48" r="3" fill="#38bdf8" filter="url(#vtx-subtle-glow)"/>
  <circle cx="100" cy="80" r="2.5" fill="#f472b6" filter="url(#vtx-subtle-glow)"/>

  <!-- 3D Geometric Vertex "R" Emblem -->
  <!-- Left Pillar with 3D Bevel -->
  <path d="M38 34 L50 34 L50 94 L38 94 Z" fill="url(#vtx-core)"/>
  <path d="M38 34 L43 34 L43 94 L38 94 Z" fill="url(#vtx-facet)"/>

  <!-- Top Loop Outer -->
  <path d="M48 34 L72 34 C84 34, 92 41, 92 51 C92 61, 84 68, 72 68 L48 68 Z" fill="url(#vtx-core)"/>
  <!-- Top Loop Inner Cutout -->
  <path d="M50 43 L70 43 C77 43, 81 46, 81 51 C81 56, 77 59, 70 59 L50 59 Z" fill="#0e101a"/>

  <!-- Diagonal Dynamic Vertex Leg -->
  <path d="M62 62 L80 94 L94 94 L74 62 Z" fill="url(#vtx-core)"/>
  <!-- Diagonal Facet Highlight -->
  <path d="M62 62 L67 62 L87 94 L82 94 Z" fill="url(#vtx-facet)"/>

  <!-- Graduation Cap Beacon Apex (GTK Motif) -->
  <path d="M64 24 L86 35 L64 46 L42 35 Z" fill="url(#vtx-facet)" opacity="0.92" filter="url(#vtx-subtle-glow)"/>
  <circle cx="64" cy="35" r="3.5" fill="#ffffff"/>

  <!-- Tassel Node with Amber Kinetic Spark -->
  <path d="M84 36 L88 50" stroke="url(#vtx-amber)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="88" cy="51" r="2.2" fill="#fbbf24" filter="url(#vtx-subtle-glow)"/>

  <!-- Starburst Flare Top Right -->
  <path d="M96 22 L98 28 L104 30 L98 32 L96 38 L94 32 L88 30 L94 28 Z" fill="#ffffff" opacity="0.85"/>
  <circle cx="96" cy="30" r="1.5" fill="#67e8f9"/>
</svg>
